name: gospl-smoke
channels:
  - conda-forge
  - geodels
  - nodefaults
dependencies:
  - python=3.11
  - numpy<2
  # goSPL dev branch: not on conda, so goSPL is built from GitHub (pip, at the
  # end) and its conda run-time dependencies are listed here, with the same
  # MPI-pinned builds as the goSPL conda package (conda/meta.yaml). The `main`
  # branch of goSPL-examples pins the latest goSPL release instead.
  - scipy
  - numpy-indexed
  - pandas
  - h5py=*=mpi_openmpi*
  - hdf5=*=mpi_openmpi*
  - vtk-base
  - ruamel.yaml
  - openmpi>=4.0,<5.0
  - mpi4py>=4.0
  - petsc>=3.21,<3.22
  - petsc4py>=3.21,<3.22
  - pyshtools
  # toolchain to build goSPL's Fortran extension
  - c-compiler
  - fortran-compiler
  - meson-python>=0.15.0
  - ninja
  - pkg-config
  # goSPL [analysis] optional extras — NOT in goSPL's conda run-deps, so the
  # analysis tools (gospl-grid/-section/-catchment, provenance) would otherwise
  # hit their try/except fallbacks. matplotlib + netcdf4 also imported directly.
  - matplotlib
  - netcdf4
  - numba
  - geopandas
  # Analysis / visualisation imported directly by the notebooks & scripts.
  - xarray
  - meshio
  - uxarray
  - pygmt
  - cartopy
  - rioxarray
  - xesmf
  - pyinterp
  - jigsawpy
  - mpas_tools
  - joblib
  # Jupyter runtime.
  - jupyterlab
  - ipywidgets
  - ipykernel
  # perlin_noise is PyPI-only (used by the dual_lithology / stratigraphic_record
  # model_setup notebooks); install via pip.
  - pip
  - pip:
      - perlin-noise
      # goSPL from the dev branch (see the top of this file)
      - gospl @ git+https://github.com/Geodels/gospl.git@dev
