name: Build and push Docker image

# Builds the gospl-smoke environment image from environment.yml (via mamba, in the
# root Dockerfile) and pushes it to Docker Hub as geodels/gospl-examples.
#
# Strategy: build each platform on a native runner (no QEMU emulation) then merge
# into a single multi-arch manifest. This avoids the QEMU download timeout that
# occurs when building linux/arm64 under emulation on an amd64 runner.
#
#   linux/amd64  -> ubuntu-latest        (native)
#   linux/arm64  -> ubuntu-24.04-arm     (native arm64 runner)
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  - a Docker Hub account with push access to geodels/gospl-examples
#   DOCKERHUB_TOKEN     - a Docker Hub access token for that account
#
# Triggers: publishing a GitHub release, pushing a git tag, or running manually.
# Published tags: the git tag name (e.g. 2026.6.13) plus `latest`.

on:
  release:
    types: [published]
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Optional extra tag to publish alongside latest (e.g. test)"
        required: false
        default: ""

env:
  IMAGE: geodels/gospl-examples

jobs:
  # ── Step 1: build each platform natively and push a per-arch digest ──────────
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Wrapped in nick-fields/retry as a belt-and-suspenders backstop: the
      # Dockerfile already retries flaky conda-forge downloads internally, but if a
      # whole build still dies (e.g. a transient registry/cache error) this restarts
      # it. The gha cache rehydrates between attempts, so a retry resumes most of the
      # work rather than rebuilding from scratch. Raw `docker buildx build` is used
      # because nick-fields/retry runs a shell command, not a `uses:` action.
      - name: Build and push digest (with retry)
        id: build
        uses: nick-fields/retry@v3
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            label_args=()
            while IFS= read -r line; do
              [ -n "$line" ] && label_args+=(--label "$line")
            done <<< "$LABELS"
            docker buildx build \
              --platform "${{ matrix.platform }}" \
              --file ./Dockerfile \
              "${label_args[@]}" \
              --provenance=false \
              --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --metadata-file /tmp/metadata.json \
              .

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Step 2: merge both digests into a single multi-arch manifest ─────────────
  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect final manifest
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:latest