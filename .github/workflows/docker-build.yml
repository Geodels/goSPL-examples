name: Build and push Docker image

# Builds the gospl-smoke environment image from environment.yml (via mamba, in the
# root Dockerfile) and pushes it to Docker Hub as geodels/gospl-examples.
#
# The image is built for both linux/amd64 and linux/arm64 (Apple Silicon) using
# QEMU emulation on the GitHub Actions runner. The arm64 build is slow (~30-60 min)
# due to QEMU, but only runs on tagged releases or manual triggers.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  - a Docker Hub account with push access to geodels/gospl-examples
#   DOCKERHUB_TOKEN     - a Docker Hub access token for that account
#
# Triggers: publishing a GitHub release, pushing a git tag, or running manually.
# Published tags: the git tag name (e.g. 2026.06.08) plus `latest`.

on:
  release:
    types: [published]
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Optional extra tag to publish alongside latest (e.g. test)"
        required: false
        default: ""

env:
  IMAGE: geodels/gospl-examples

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up runner disk space
        # The goSPL / PETSc / GMT / VTK stack produces a large image; reclaim space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event.inputs.extra_tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max