name: Test hillslope diffusion

domain:
    npdata: ['data/gospl_mesh','v','c','z']
    flowdir: 3
    bc: '0000'

time:
    start: 0.
    end: 1.e5
    tout: 1.e4
    dt: 5000.

spl:
    K: 1.0e-10
    d: 0.
    m: 0.5

diffusion:
    hillslopeKa: 10.0
    hillslopeKm: 10.0
    # hillslopenl: 2.5
    hillslopeSc: 0.8
    hillslopeNb: 4

sea:
    position: -1000.

climate:
  - start: 0.
    uniform: 1

output:
    dir: 'sim_diffusion_critical_slope'
