name: Test stratigraphic evolution with continental deposition enable

domain:
    npdata: ['inputs/gospl_mesh','v','c','z']   # initial mesh ['path', vertices, cells, elevation] (.npz)
    bc: 'ofof'   # boundary conditions per edge N,E,S,W (o=open, f=fixed, w=wall)
    flowdir: 5   # flow-direction method: 1 (SFD) to 6 (MFD)

time:
    start: 0.   # model start time (years)
    end: 2.5e5   # model end time (years)
    tout: 1.e4   # output interval (years)
    dt: 5.e3   # internal time step (years)
    strat: 5.e3   # stratigraphic-record update interval (years)

spl:
    K: 4.e-5   # stream-power erodibility coefficient in E = K (P^d A)^m S^n
    d: 0.42   # precipitation exponent (default 0.0)
    m: 0.45   # flow-accumulation/area exponent (default 0.5)
    G: 3.   # continental deposition coefficient (default 0.0; >0 = transport-limited)

diffusion:
    hillslopeKa: 0.1   # aerial (land) linear hillslope diffusivity (m^2/yr)
    hillslopeKm: 0.8   # marine linear hillslope diffusivity (m^2/yr)
    nonlinKm: 1000.   # non-linear diffusivity for fresh river-deposited marine sediment (m^2/yr)
    clinSlp: 5.e-4   # max clinoform slope; caps marine deposit top vs distance-to-shore

sea:
    position: -30.   # relative sea-level position (m) (default 0)
    curve: 'inputs/sealevel.csv'   # CSV of sea level over time (columns: time yr, position m)

climate:
  - start: 0.   # event start time (years)
    uniform: 1   # uniform rainfall applied over whole mesh (m/yr)

compaction:
    phis: 0.49   # surface porosity (default 0.49)
    z0s: 3700.0   # porosity e-folding depth (m) (default 3700)

output:
    dir: 'stratiG'   # output directory name
