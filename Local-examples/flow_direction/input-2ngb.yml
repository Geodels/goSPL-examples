name: Test flow direction 2 directions

domain:
    npdata: ['data/sombrero','v','c','z']   # initial mesh: [path, vertices, cells, elevation] (.npz)
    flowdir: 2   # flow-direction method: 1=SFD ... 6=MFD
    bc: 'oooo'   # boundary conditions N,E,S,W; o=open, f=fixed, w=wall
    seadepo: False   # enable marine deposition (default True)

time:
    start: 0.   # model start time (years)
    end: 1.e5   # model end time (years)
    tout: 5.e3   # output interval (years)
    dt: 1000.   # internal time step (years)

spl:
    K: 4.0e-6   # stream-power erodibility coefficient in E = K (P^d A)^m S^n
    d: 0.   # precipitation exponent (default 0.0)
    m: 0.5   # flow-accumulation/area exponent (default 0.5)

diffusion:
    hillslopeKa: 0.1   # aerial (land) linear hillslope diffusivity (m^2/yr)
    hillslopeKm: 0.2   # marine linear hillslope diffusivity (m^2/yr)

sea:
    position: -100.   # relative sea-level position (m) (default 0)

climate:
  - start: 0.   # event start time (years)
    uniform: 1   # uniform rainfall over whole mesh (m/yr)

output:
    dir: 'sim_2ngb'   # output directory name
