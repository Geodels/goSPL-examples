name: Tropical ferricrete & relief inversion (local)

# A simple, controlled tropical landscape: parallel river valleys separated by highland
# ridges (inputs/gospl_mesh_valleys.npz), gently uplifted so the rivers stay active.
# An IRON ferricrete forms ONLY in the wet river valleys -- the water table sits near
# the surface in the valley floors and deep under the ridges, so the capillary fringe
# indurates the valley ground. Because the crust ARMOURS the erodibility, the armoured
# valleys keep pace with the gentle uplift while the un-armoured ridges are worn down,
# and the RELIEF INVERTS: the former valleys stand up as ferricrete-capped mesas.
# Build the mesh first:  python build_inputs.py

domain:
    npdata: ['inputs/gospl_mesh_valleys','v','c','z']   # v, c, z (+ t = uniform uplift)
    flowdir: 5                # multiple-flow-direction routing
    bc: 'owow'                # NESW: E/W walls (edges are ridge divides -> no side leakage); N/S drain south

time:
    start: 0.
    end: 1.5e7                # 15 Myr: 5 Myr crust growth + 10 Myr dissection to mesas
    tout: 2.5e5               # 60 outputs (2.5 Myr = step 10, 5/10/15 Myr = steps 20/40/60)
    dt: 2.e4                  # internal step (gentle rates tolerate a large step)
    strat: 2.5e5               # stratigraphy on -> archive/re-arm the valley ferricrete

spl:
    K: 5.5e-6                  # soft saprolite substrate; the ferricrete armours it ~20x
    d: 0.
    m: 0.5

diffusion:
    hillslopeKa: 0.06         # weak creep: keeps the emerging mesa scarps sharp
    hillslopeKm: 0.05

sea:
    position: -1000.          # continental upland: everything is subaerial

# Evolving climate: a WET tropical phase grows the ferricrete in the valleys, then a
# DRIER phase leaves it relict (stops forming, decays only slowly) while the ridges are
# worn down and the relief inverts.
climate:
  - start: 0.
    uniform: 2.5              # STAGE 1 wet tropical: grows the broad valley-floor ferricrete
  - start: 5.e6
    uniform: 1.2              # STAGE 2 drier: crust goes relict as the dissection begins

tectonics:
  - start: 0.
    end: 5.e6
    upsub: ['inputs/gospl_mesh_valleys','t1']   # STAGE 1: tectonically quiet (crust forms)
  - start: 5.e6
    end: 1.e8
    upsub: ['inputs/gospl_mesh_valleys','t2']   # STAGE 2: base-level fall drives the dissection

# ---------------------------------------------------------------------------
# Water table + capillary-fringe iron duricrust + conservative iron geochemistry
# ---------------------------------------------------------------------------
groundwater:
    Ksat: 1.0e4               # aquifer transmissivity
    specific_yield: 0.1
    aquifer_base: 30.0        # unconfined-zone depth below the surface (m)
    # Recharge chosen so the water table is SHALLOW in the valley floors (wtdepth ~ 0,
    # where the fringe crust forms) and DEEP under the ridge crests -- the valley-shallow
    # / ridge-deep structure that localises the ferricrete in the river valleys.
    infiltration: 0.3
    conserve_baseflow: True

    duricrust:
        form_rate: 5.0e-5     # crust formation rate (m/yr)
        max_thickness: 20.0   # duriH_max (m): a thick sheet to survive dissection
        fringe_depth: 2.0     # capillary fringe -> crust where the table is near surface
        fringe_width: 2.0
        armor_max: 0.98       # very strong ferricrete armour (~33x harder to erode)
        decay_rate: 1.0e-9    # very slow dissolution -> the relict cap persists as it inverts
        weathering:
            mode: proxy       # climate-proxy weathering supply (no soil tracked)

    geochem:
        conserve: True
        river_load: True      # route the dissolved iron down the rivers
        species:
          - {name: iron, weatherability: 1.0, precip_rate: 2.0e-4, solid_volume: 1.0}

output:
    dir: 'sim_ferricrete'
