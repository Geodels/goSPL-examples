name: Test escarpment retreat with orographic rain

domain:
    npdata: ['data/escarpment','v','c','z']   # initial mesh ['path', vertices, cells, elevation] (.npz)
    # npdata: ['data/mesh','v','c','z']
    flowdir: 1   # flow-direction method: 1 (SFD) to 6 (MFD)
    seadepo: False   # enable marine deposition (default True)
    bc: 'oofo'   # boundary conditions per edge N,E,S,W (o=open, f=fixed, w=wall)

time:
    start: 0.   # model start time (years)
    end: 50.e6   # model end time (years)
    tout: 1.e6   # output interval (years)
    dt: 1.e5   # internal time step (years)

spl:
    K: 2.e-6   # stream-power erodibility coefficient in E = K (P^d A)^m S^n
    d: 0.   # precipitation exponent (default 0.0)
    m: 0.4   # flow-accumulation/area exponent (default 0.5)

diffusion:
    hillslopeKa: 0.2   # aerial (land) linear hillslope diffusivity (m^2/yr)
    hillslopeKm: 1.0   # marine linear hillslope diffusivity (m^2/yr)

flexure:
    method: 'fem'   # 'fem' (flat/2D) or 'global' (spherical)
    thick: 20.e3   # elastic thickness Te (m)
    rhoc: 2300.0   # crust/sediment load density (kg/m^3)
    rhoa: 3300.0   # asthenosphere density (kg/m^3)
    young: 65e9   # Young's modulus (Pa)
    nu: 0.25   # Poisson ratio
    bcN: "0Slope0Shear"   # north edge boundary: 0Slope0Shear, Mirror, or 0Displacement0Slope
    bcE: "Mirror"   # east edge boundary: 0Slope0Shear, Mirror, or 0Displacement0Slope
    bcS: "0Displacement0Slope"   # south edge boundary: 0Slope0Shear, Mirror, or 0Displacement0Slope
    bcW: "Mirror"   # west edge boundary: 0Slope0Shear, Mirror, or 0Displacement0Slope

sea:
    position: -10.   # relative sea-level position (m) (default 0)

orography:
    wind_speed: 5.0   # uniform wind speed (m/s) (default 10.0)
    wind_dir: 180   # wind direction it comes from, degrees (0=N, 90=E, 180=S, 270=W)
    env_lapse_rate: -4   # environmental lapse rate (degC/km) (default -4.0)
    moist_lapse_rate: -7   # moist adiabatic lapse rate (degC/km) (default -7.0)
    ref_density: 7.4e-3   # reference saturation water-vapour density (kg/m^3) (default 7.4e-3)
    conv_time: 1000.   # cloud-water to hydrometeor conversion time (s) (default 1000)
    fall_time: 1000.   # hydrometeor fallout time (s) (default 1000)
    precip_base: 2.0   # uniform background precipitation rate (mm/h) (default 7.0)
    precip_min: 0.01   # minimum precipitation floor (mm/h) (default 0.01)
    rainfall_frequency: 1   # number of 1-hour storms per day (default 1)

output:
    dir: 'escarpment-oro'   # output directory name
